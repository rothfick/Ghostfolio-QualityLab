[project]
name = "ghostfolio-quality-lab"
version = "0.1.0"
description = "Independent quality engineering for Ghostfolio"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1.0"
]

[dependency-groups]
dev = [
    "pytest>=8,<10"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
