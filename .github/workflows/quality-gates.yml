name: Financial Core Quality Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: financial-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  financial-core:
    name: Financial Core / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: latest-known
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install locked dependencies
        run: uv sync --locked --group dev --python 3.12

      - name: Run financial core tests
        run: |
          mkdir -p reports
          uv run --no-sync pytest -m unit -v \
            --junitxml=reports/unit.xml

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: financial-core-junit
          path: reports/unit.xml
          if-no-files-found: warn
          retention-days: 14
